# wordrush 运行配置模板（复制为 config.yaml 后按需修改；该文件不入库）。
# 密钥不留在这里：DB 密码 / CF AI Token 等用 WORDRUSH_* 环境变量覆盖（见 .env）。
server:
  addr: ":8092"
  # 浏览器直连白名单；前端经 Pages _redirects 同域代理时其实用不到，留作直连备用
  allowed_origins:
    - "https://eng.taojun.top"
    - "http://localhost:5174"
    # Capacitor 壳内 WebView 的 origin（androidScheme: https → https://localhost）
    - "https://localhost"
    - "capacitor://localhost"

ucenter:
  base_url: "https://ucenter.june-t.top"
  app: "wordrush"
  jwks_ttl: "1h"

db:
  # 数据库地址与账号建议全部走环境变量（WORDRUSH_DB_*），这里只做兜底。
  # 不要把真实内网地址写进仓库。
  host: "db.example.internal"
  port: 3306
  name: "wordrush"
  user: "wordrush"
  # 托管 MySQL 的内部域名常是自签证书，不能用 true（会强制校验证书而失败）
  tls_mode: "preferred"
  max_open_conns: 8
  max_idle_conns: 4
  conn_max_lifetime_sec: 180

speak_eval:
  # 发音评测微服务（如 OpenPronounce，Python venv 或容器）
  # 本机裸跑 / docker host 网络用 http://127.0.0.1:8100
  base_url: "http://127.0.0.1:8100"
  timeout: "60s"

ai:
  # 口语对话（Cloudflare Workers AI，OpenAI 兼容端点）
  # api_token / account_id 不入库，由 WORDRUSH_AI_API_TOKEN / WORDRUSH_AI_ACCOUNT_ID 注入
  account_id: "<your-cloudflare-account-id>"
  model: "@cf/zai-org/glm-4.7-flash"
  timeout: "30s"
  # 关闭模型思考链：闲聊场景可把输出 token 降两个数量级（省额度、更快）
  enable_thinking: false
